var KEY="49er-results-unlock";
function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function tob64(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
var msg=document.getElementById("msg"),btn=document.getElementById("go"),pw=document.getElementById("pw"),rem=document.getElementById("rem");
if(!window.crypto||!crypto.subtle){msg.textContent="This browser cannot open protected pages. Please update Safari or Chrome.";btn.disabled=true;return;}
function derive(pass){return crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]).then(function(base){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);});}
function open(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c)).then(function(buf){
  var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close();});}
function tryStored(){var k=null;try{k=localStorage.getItem(KEY);}catch(e){}
  if(!k)return;btn.disabled=true;msg.style.color="#9AABB7";msg.textContent="Opening…";
  crypto.subtle.importKey("raw",b64(k),{name:"AES-GCM"},false,["decrypt"]).then(open).catch(function(){try{localStorage.removeItem(KEY);}catch(e){}
    btn.disabled=false;msg.textContent="";});}

  derive(pw.value).then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c)).then(function(){

      try{localStorage.removeItem(KEY);}catch(e){}return key;});})
